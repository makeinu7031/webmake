<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>My Page</title>
    <link rel="stylesheet" href="assets/css/index.css">
</head>

<body>
    <header class="header">
        <div class="nav-wrapper">
            <nav class="header-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="./index.html"><img src="assets/images/icons/home.png" alt="home"></a></li>
                    <li class="nav-item"><a href="./aboutme.html"><img src="assets/images/icons/aboutme.png" alt="aboutme"></a></li>
                    <li class="nav-item"><a href="./something.html"><img src="assets/images/icons/something.png" alt="something"></a></li>
                </ul>
            </nav>
        </div>
        <!-- ハンバーガーメニュー -->
        <button class="burger-btn">
            <span class="bar bar_top"></span>
            <span class="bar bar_mid"></span>
            <span class="bar bar_bottom"></span>
        </button>
    </header>

    <main>
        <div class="title">
            <img src="assets/images/content/title.png" alt="title" class="title">
        </div>

        <div class="spotify">
            <iframe
                style="border-radius:12px"
                src="https://open.spotify.com/embed/playlist/5fHJD5UDHjMvMLI7Vp2kry?utm_source=generator&theme=0"
                width="100%" height="352" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
            ></iframe>
        </div>

        <section class="message message--about-site">
            <div class="text">
                <div class="text_sub text_sub--about">
                    <h2 class="about-site__title">このサイトについて</h2>
                    <div class="about-site__block">
                        <h3 class="about-site__heading">作られた目的</h3>
                        <p>Webサイト制作の練習と、自己紹介・作品の紹介を目的として作成しました。</p>
                    </div>
                    <div class="about-site__block">
                        <h3 class="about-site__heading">使用している構成・ツール</h3>
                        <p>静的サイトとして、次の技術で構成しています。</p>
                        <ul class="tech-list">
                            <li><span class="tech-tag">HTML</span> … 構造</li>
                            <li><span class="tech-tag">CSS</span> … デザイン・レスポンシブ対応</li>
                            <li><span class="tech-tag">JavaScript</span> … ハンバーガーメニューなどの挙動</li>
                            <li><span class="tech-tag">Cursor</span> … コード編集・開発補助</li>
                            <li><span class="tech-tag">GitHub Pages</span> … 公開・ホスティング</li>
                        </ul>
                        <p class="about-site__note">エディタには Cursor を用い、コーディングや構成の整理を行っています。このサイトは GitHub Pages で公開しています。</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script
        src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous"
    ></script>
    <script src="assets/js/menu.js"></script>

<footer></footer>
